name: Build and Release Standalone Executable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Single Executable (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 requests beautifulsoup4 pyinstaller

      - name: Build Standalone Windows .exe with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "DaejinSugangSuite" --add-data "targets.json;." gui_qt.py

      - name: Rename & Prepare Artifact
        shell: bash
        run: |
          mv dist/DaejinSugangSuite.exe dist/DaejinSugangSuite-Windows-x64.exe

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: "대진대학교 수강신청 마스터 자동화 GUI ${{ github.ref_name }}"
          body: |
            ## 🎓 대진대학교 초고속 수강신청 마스터 GUI 배포판 (${{ github.ref_name }})

            설치 없이 바로 실행 가능한 Windows 단일 실행 파일(`.exe`)입니다.

            ### ✨ 주요 기능
            1. **실시간 과목 검색 & 빈자리 옵저버**: 실시간 잔여석, 정렬, 1클릭 수강신청
            2. **정각 10:00:00 패킷 스나이퍼**: 서버 타임 밀리초 동기화 & 10시 정각 자동 신청
            3. **24시간 백그라운드 취소표 헌터**: 원하는 과목 빈자리 생길 때 0.01초 즉각 신청
            4. **내 수강신청 내역 & 장바구니 실시간 조회**

            ### 🚀 실행 방법
            1. 아래 `DaejinSugangSuite-Windows-x64.exe` 파일을 다운로드합니다.
            2. 더블 클릭하여 실행 후 학번과 비밀번호를 입력하고 사용하시면 됩니다.
          files: |
            dist/DaejinSugangSuite-Windows-x64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
